name: Build TransTools Windows (.exe)

on:
  workflow_dispatch:
    inputs:
      test_models:
        description: Run real Supertonic and VieNeu inference on Windows
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build & Package Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build native VieNeu phonemizer (no Python runtime)
        shell: pwsh
        run: ./windows/scripts/build-native-phonemizer.ps1

      - name: Restore NuGet Packages
        shell: pwsh
        run: |
          dotnet restore windows/TransTools/TransTools.csproj

      - name: Cache verified TTS test models
        if: github.event_name == 'workflow_dispatch' && inputs.test_models
        uses: actions/cache@v4
        with:
          path: windows/test-models
          key: windows-tts-${{ hashFiles('windows/TransTools/Resources/Models/supertonic.json', 'windows/TransTools/Resources/SpeechNative/vieneu-native-manifest.json') }}

      - name: Download pinned TTS test models
        if: github.event_name == 'workflow_dispatch' && inputs.test_models
        shell: pwsh
        run: ./windows/scripts/download-test-models.ps1

      - name: Run contracts on native Windows
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.test_models }}' -eq 'true') {
            ./windows/scripts/test-windows-contracts.ps1 -SupertonicModel windows/test-models/supertonic -VieNeuModel windows/test-models/vieneu -RequireModels
          } else {
            ./windows/scripts/test-windows-contracts.ps1
          }

      - name: Render and validate WPF screens
        shell: pwsh
        run: |
          dotnet run --project windows/tests/UiSmoke -c Release -- windows/test-results/ui
          if ($LASTEXITCODE -ne 0) { throw 'Windows UI smoke tests failed.' }

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-contract-evidence
          path: windows/test-results/**
          if-no-files-found: warn

      - name: Build Microsoft local translation compatibility probe
        shell: pwsh
        run: |
          node --test windows/tests/EdgeTranslationProbe/probe.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Translation probe contract tests failed.' }
          dotnet publish windows/tests/EdgeTranslationProbe -c Release -r win-x64 --self-contained true -o windows/probe-build
          if ($LASTEXITCODE -ne 0) { throw 'Translation probe build failed.' }

      - name: Upload compatibility probe (test tool only)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Local-Translation-Probe
          path: windows/probe-build/**

      - name: Publish Single-File Executable
        shell: pwsh
        run: |
          dotnet publish windows/TransTools/TransTools.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o windows/build

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Installer (TransTools-Setup.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer/installer.iss

      - name: Verify package contains no build SDK or source tree
        shell: pwsh
        run: |
          foreach ($name in @('sea-g2p-native-source','native-build','test-models','.git','Cargo.toml','Cargo.lock')) {
            if (Get-ChildItem windows/build -Recurse -Force | Where-Object Name -eq $name) { throw "Unexpected build resource packaged: $name" }
          }
          if (!(Test-Path windows/build/SpeechNative/sea_g2p_rs.dll)) { throw 'Native VieNeu processor missing from package.' }

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          $files = Get-ChildItem windows/build -Exclude 'TransTools-Setup.exe','TransTools-Windows-Portable.zip','*.pdb'
          Compress-Archive -Path $files.FullName -DestinationPath windows/build/TransTools-Windows-Portable.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TransTools-Windows-Release
          path: |
            windows/build/TransTools.exe
            windows/build/runtimes/**
            windows/build/SpeechNative/**
            windows/build/TransTools-Setup.exe
            windows/build/TransTools-Windows-Portable.zip
