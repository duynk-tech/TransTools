name: Windows translation availability evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Query WebView2 availability without model downloads
        shell: pwsh
        run: |
          dotnet run --project windows/tests/EdgeTranslationProbe -c Release -- --availability-report windows/test-results/translation-availability.json
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility probe failed to execute.' }
          if (!(Test-Path windows/test-results/translation-availability.json)) { throw 'Compatibility evidence missing.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-translation-availability
          path: windows/test-results/translation-availability.json
