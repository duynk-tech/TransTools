name: Release TransTools (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transtools-release
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS (ZIP & DMG)
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Build and Package ZIP and DMG
        run: zsh scripts/package-release.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts
          path: |
            build/TransTools.zip
            build/TransTools.zip.sha256
            build/TransTools.dmg
            build/TransTools.dmg.sha256

  build-windows:
    name: Build Windows (.exe & Setup)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build native VieNeu phonemizer (no Python runtime)
        shell: pwsh
        run: ./windows/scripts/build-native-phonemizer.ps1

      - name: Restore NuGet Packages
        shell: pwsh
        run: dotnet restore windows/TransTools/TransTools.csproj

      - name: Publish Single-File Executable
        shell: pwsh
        run: dotnet publish windows/TransTools/TransTools.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o windows/build

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Installer (TransTools-Setup.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer/installer.iss

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          $files = Get-ChildItem windows/build -Exclude 'TransTools-Setup.exe','TransTools-Windows-Portable.zip','*.pdb'
          Compress-Archive -Path $files.FullName -DestinationPath windows/build/TransTools-Windows-Portable.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            windows/build/TransTools.exe
            windows/build/runtimes/**
            windows/build/SpeechNative/**
            windows/build/TransTools-Setup.exe
            windows/build/TransTools-Windows-Portable.zip

  publish-release:
    name: Publish Release (GitHub & Vercel)
    needs: [build-macos, build-windows]
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release-artifacts
          path: build

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: windows/build

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/TransTools.zip
            build/TransTools.zip.sha256
            build/TransTools.dmg
            build/TransTools.dmg.sha256
            windows/build/TransTools.exe
            windows/build/TransTools-Setup.exe
            windows/build/TransTools-Windows-Portable.zip
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Set up Node for public downloads
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install release service dependencies
        run: npm ci --ignore-scripts

      - name: Validate update manifest
        run: |
          npm run test:updates
          zsh scripts/test-update-manifest.sh
