name: Release TransTools

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package TransTools
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Build and Package ZIP and DMG
        run: zsh scripts/package-release.sh

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/TransTools.zip
            build/TransTools.zip.sha256
            build/TransTools.dmg
            build/TransTools.dmg.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
