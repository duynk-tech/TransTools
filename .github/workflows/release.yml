name: Release TransTools

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transtools-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Package TransTools
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Build and Package ZIP and DMG
        run: zsh scripts/package-release.sh

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/TransTools.zip
            build/TransTools.zip.sha256
            build/TransTools.dmg
            build/TransTools.dmg.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Set up Node for public downloads
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install release service dependencies
        run: npm ci --ignore-scripts

      - name: Validate update manifest
        run: |
          npm run test:updates
          zsh scripts/test-update-manifest.sh

      - name: Publish ZIP, DMG and latest manifest to Vercel Blob
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_NOTES_FILE: docs/release-${{ github.ref_name }}.md
        run: npm run publish:release
